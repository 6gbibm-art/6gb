<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Career Coach | System Terminal{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="icon" href="/static/images/favicon/favicon.ico">
    {% block styles %}{% endblock %}
</head>
<body>

    <header class="glass-panel">
        <a href="/dashboard" class="logo">
    Nextstep AI
        </a>
        <nav>
            <a href="/dashboard" class="nav-btn {% if active_page == 'dashboard' %}active{% endif %}">Home</a>
            <a href="/resume" class="nav-btn {% if active_page == 'resume' %}active{% endif %}">ATS Analyzer</a>
            <a href="/cover-letter" class="nav-btn {% if active_page == 'cover-letter' %}active{% endif %}">Cover Letters</a>
            <a href="/interview-prep" class="nav-btn {% if active_page == 'interview-prep' %}active{% endif %}">Interview Prep</a>
            <a href="/about" class="nav-btn {% if active_page == 'about' %}active{% endif %}">About 6GB</a>
        </nav>
    </header>

    <main class="container">
        {% block main %}{% endblock %}
    </main>
{% block scripts %}{% endblock %}
</body>
</html>
