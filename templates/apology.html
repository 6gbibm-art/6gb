{% extends "layout.html" %}
{% block title %}Error | AI Career Coach{% endblock %}

{% block main %}
<section class="view-section active glass-panel" style="text-align: center; padding: 4rem 2rem;">
    <h2 style="color: #ff3366; font-size: 2rem;">System Error</h2>
    <p class="terminal-text" style="font-size: 1.1rem; margin-top: 1rem;">
        > EXCEPTION CAUGHT: {{ message | default("An unexpected error occurred.") }}
    </p>
    
    <div style="margin-top: 2rem;">
        <a href="/" class="action-btn" style="text-decoration: none; display: inline-block;">Return to Dashboard</a>
    </div>
</section>
{% endblock %}
